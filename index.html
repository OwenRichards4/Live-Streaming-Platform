<script>
let followedArr = [];
// ######################## FEATURED AND RECOMMENDED VIDEO DISPLAYS ######################## \\
function createFollowedVideoDisplay(displayedData, itter) {
    document.getElementById("channel-name-" + itter).innerHTML = displayedData.username;
    document.getElementById('channel-title-' + itter).innerHTML = displayedData.title;
    document.getElementById('channel-game-' + itter).innerHTML = displayedData.category;
}




// ######################## FILL DISPLAYED DATA ######################## \\
fetchUserFollowerData();
fetchUserRecommendationData();
fetchAccountsData();
fetchUserData();
fetchGameDisplayData();





// ######################## DISCOVER GAME CATEGORIES ######################## \\
function fillCards(displayedData, itter) {
    let img = document.getElementById('game-image-' + itter);
    let card = document.getElementById('game-card-' + itter);
    let gameName = document.getElementById('game-title-' + itter);
    let viewers = document.getElementById('game-count-' + itter);
    
    gameName.innerHTML = displayedData.name;
    viewers.innerHTML = "Viewers: " + displayedData.liveCount;

    if (displayedData.src == "images/cards/IRL-card") {
        img.src = "images/cards/iRL-card" + ".png";
    } else {
        img.src = displayedData.src + ".png";
    }

    img.onerror = function() {
        img.onerror = null; 
        img.src = displayedData.src + '.jpg';
    };
}

let cards = document.querySelectorAll('.game-card');
cards.forEach(element => {
    element.addEventListener("click", function() {
        localStorage.setItem('searchedGame', element.children[1].innerHTML)
        explore("category");
    });
});





// ######################## FEATURED DATA ######################## \\
function fillFeaturedData(displayedData) {
    let featTitle = document.getElementById('featured-video-title');
    let featName = document.getElementById('featured-video-channel');
    let featCat = document.getElementById('featured-video-game');
    let featDes = document.getElementById('featured-video-description');
    
    featTitle.innerHTML = displayedData.title;
    featName.innerHTML = displayedData.username;
    featCat.innerHTML = displayedData.category;

    document.getElementById('primary-featured-video-section').addEventListener('click', () => {
        localStorage.setItem('viewingName', displayedData.username)
        localStorage.setItem('viewingCategory', featCat.innerHTML = displayedData.category)

        fetchAccountsData();
        
        getChannelIcon(displayedData.username);
        getChannelTitle(displayedData.username);
        getViewerCount(displayedData.username)

        window.location.href = "channelPage.html";
    });
}
