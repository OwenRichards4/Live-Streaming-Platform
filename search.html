<script>
let search = localStorage.getItem('search');
document.getElementById('results-h4').innerHTML += '&nbsp&nbsp&nbsp&nbsp;"' + search + '"';
// TO DO PERFORMANCE NEEDS TO BE IMPORVED - SEARCH IN LOOPS OF POTENTIAL CAUSES

if (localStorage.getItem('theme')) {
    if (localStorage.getItem('theme') == "light") {
        localStorage.setItem('theme', "dark");
    } else {
        localStorage.setItem('theme', "light");
    }
    themeToggle();
} else {
    getTheme();
}

async function getStreamersJson() {
    if (!accounts) {
        await fetchAccountsData();
    }
    let jsonData = accounts;
    let channelNameCount = 1;
    let channelTitleCount = 1;
    for (let i = 0; i < jsonData.length; i++) {
        if ((jsonData[i].live && (jsonData[i].title.toUpperCase().includes(search.toUpperCase()) || jsonData[i].category.toUpperCase().includes(search.toUpperCase()))) && channelTitleCount <= 5) {
            let tempDisplay = document.createElement('div');
            tempDisplay.id = "live-channel-display-" + channelTitleCount;
            tempDisplay.className = "live-channel-display";

            let video =  document.createElement('div');
            video.id = 'video-element-' + channelTitleCount;
            video.className = "video-element";

            let img = document.createElement('img');
            img.className = "channel-img";
            img.src = jsonData[i].icon + ".png";

            let title = document.createElement('h4');
            title.id = "channel-title-1"
            title.className = "channel-title";
            title.innerHTML = jsonData[i].title;

            let name = document.createElement('h4');
            name.id = "channel-name-1"
            name.className = "channel-name";
            name.innerHTML = jsonData[i].username;

            let game = document.createElement('h4');
            game.id = "channel-game-1"
            game.className = "channel-game";
            game.innerHTML = jsonData[i].category;

            let h4s = document.createElement('div');
            h4s.className = "channel-h4s";
            h4s.append(title, name, game);

            let details = document.createElement('div');
            details.className = "channel-details";
            details.append(img, h4s)

            tempDisplay.append(video, details)

            document.getElementById('searched-channels').appendChild(tempDisplay);

            channelTitleCount++;
        }

        if (jsonData[i].username.toUpperCase().includes(search.toUpperCase()) && channelNameCount <= 3) {
            let tempDisplay = document.createElement('div');
            tempDisplay.className = "streamer-card";
            tempDisplay.id = "streamer-card-" + channelNameCount;

            let img = document.createElement('img');
            img.className = "streamer-card-img";
            img.id = "streamer-card-img-" + channelNameCount;
            img.src = jsonData[i].icon + ".png";

            let name = document.createElement('h4');
            name.className = "streamer-card-name";
            name.id = "streamer-card-name-" + channelNameCount;
            name.innerHTML = jsonData[i].username;

            let title = document.createElement('h4');
            title.className = "streamer-card-title";
            title.id = "streamer-card-title-" + channelNameCount;
            title.innerHTML = jsonData[i].title;

            let desc = document.createElement('h4');
            desc.className = "streamer-card-desc";
            desc.id = "streamer-card-desc-" + channelNameCount;
            desc.innerHTML = jsonData[i].description;

            let info = document.createElement('div');
            info.className = "streamer-card-info";
            info.id = "streamer-card-info-" + channelNameCount;

            info.append(name, title, desc);

            tempDisplay.append(img, info);

            tempDisplay.addEventListener("click", function() {
                localStorage.setItem('viewingName', jsonData[i].username)
                localStorage.setItem('viewingCategory', jsonData[i].category);

                fetchAccountsData();
                
                getChannelIcon(jsonData[i].username);
                getChannelTitle(jsonData[i].username);

                window.location.href = "channelPage.html";
            });
            
            document.getElementById('streamer-cards').appendChild(tempDisplay);

            channelNameCount++;
        }
    }

    if (channelTitleCount == 1) {
        let cantFind = document.createElement('h4');
        cantFind.innerHTML = "Weird... we couldn't find anything";
        document.getElementById('searched-channels').append(cantFind);
    }

    if (channelNameCount == 1) {
        let cantFind = document.createElement('h4');
        cantFind.innerHTML = "Weird... we couldn't find anything";
        document.getElementById('streamer-cards').append(cantFind);
    }
}

async function getGamesJson() {
    if (!games) {
        await fetchGamesData();
    }
    let jsonData = games;
    let count = 1;
    for (let i = 0; i < jsonData.length; i++) {
        if (jsonData[i].name.toUpperCase().includes(search.toUpperCase()) && count <= 8) {
            let newDiv = document.createElement('div');
            newDiv.className = "game-card";
            newDiv.id = "game-card-" + count; 

            newDiv.addEventListener("click", function() {
                localStorage.setItem('searchedGame', newDiv.children[1].innerHTML)
                explore("category");
            });
            
            let html = `<img src="" class="game-image" id="game-image-${count}">
            <h4 class="game-title" id="game-title-${count}"></h4>
            <h4 class="game-count" id="game-count-${count}"></h4>`

            let string = "";
            let spaceCheck = false;
            for (let j = 0; j < jsonData[i].name.length; j++) {
                if (j == 0) {
                    string += jsonData[i].name[j].toLowerCase();
                } else if (jsonData[i].name[j] == " ") {
                    spaceCheck = true
                } else {
                    if (spaceCheck) {
                        string += jsonData[i].name[j].toUpperCase();
                        spaceCheck = false;
                    } else {
                        string += jsonData[i].name[j];
                    }
                }
            }

            newDiv.innerHTML = html;
    
            document.getElementById('game-cards').append(newDiv)

            document.getElementById('game-image-' + count).src = "images/cards/" + string + "-card.png";
            document.getElementById('game-image-' + count).style.width = newDiv.style.width = "160px";

            document.getElementById('game-title-' + count).innerHTML = jsonData[i].name;

            document.getElementById('game-count-' + count).innerHTML = "Viewers: " + jsonData[i].liveCount;

            count++;
        }
    }
    if (count == 1) {
        let cantFind = document.createElement('h4');
        cantFind.innerHTML = "Weird... we couldn't find anything";
        document.getElementById('game-cards').append(cantFind);
    }
}



window.onload = async function() {
    await getGamesJson();
    await getStreamersJson();

    let headerButtons = document.getElementById('header-buttons');
    if (localStorage.getItem('user') != "" && localStorage.getItem('user') != null && headerButtons) {
        headerButtons.removeChild(headerButtons.lastElementChild)

        let img = document.createElement('img');
        
        img.src = localStorage.getItem('userLogo');
        img.className = "channel-logo";

        headerButtons.appendChild(img);
    }

    if (localStorage.getItem('theme')) {
        if (localStorage.getItem('theme') == "light") {
            localStorage.setItem('theme', "dark");
        } else {
            localStorage.setItem('theme', "light");
        }
        themeToggle();
    } else {
        getTheme();
    }

    liveChannelDisplayAddEvent();  
}
